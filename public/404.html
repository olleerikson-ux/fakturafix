<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sidan finns inte – Fakturafix</title>
    <link rel="icon" href="/fakturafix/favicon.svg" type="image/svg+xml" />
    <style>
      :root { --bg: #f3f4f6; --text: #1b1f24; --muted: #566070; --accent: #2f5577; --on-accent: #fff; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #151a21; --text: #e4e8ed; --muted: #a0aab8; --accent: #8db4d9; --on-accent: #0f1a26; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: var(--text); background: var(--bg); text-align: center; }
      h1 { margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; }
      .btn { display: inline-block; margin: 4px; padding: 12px 24px; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; }
      .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
      .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sidan finns inte</h1>
      <p>Länken kan vara felskriven eller så har sidan flyttats.</p>
      <a class="btn" href="/fakturafix/">Till startsidan</a>
      <a class="btn secondary" href="/fakturafix/app/">Öppna appen</a>
    </main>
  </body>
</html>
